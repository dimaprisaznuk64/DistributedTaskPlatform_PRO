apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-rabbitmq
  namespace: tasks-platform
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: task_executions
        mode: QueueLength
        value: "10"
        useQueueNameInHost: "false"
      authenticationRef:
        name: keda-rabbitmq-trigger-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-rabbitmq-trigger-auth
  namespace: tasks-platform
spec:
  secretTargetRef:
    - parameter: host
      name: platform-credentials
      key: KEDA_RABBITMQ_URL